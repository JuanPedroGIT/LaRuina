<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiestas de Agosto 2026</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EBDFC1;
    --paper-card:#FFFBF2;
    --ink:#2B1B17;
    --ink-soft:#5B4A41;
    --saffron:#E8A33D;
    --saffron-deep:#C77D1E;
    --red:#A62639;
    --red-deep:#7D1B2A;
    --teal:#1D4E4E;
    --teal-deep:#123636;
    --line: rgba(43,27,23,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .bunting{
    display:flex;
    overflow:hidden;
    height:26px;
    width:100%;
  }
  .bunting span{
    flex:1 0 22px;
    height:22px;
    clip-path:polygon(0 0,100% 0,50% 100%);
    animation: sway 3.2s ease-in-out infinite;
    transform-origin: top center;
  }
  .bunting span:nth-child(4n){background:var(--red);}
  .bunting span:nth-child(4n+1){background:var(--saffron);}
  .bunting span:nth-child(4n+2){background:var(--teal);}
  .bunting span:nth-child(4n+3){background:var(--paper-card);}
  .bunting span:nth-child(odd){animation-delay:0.15s;}
  @keyframes sway{
    0%,100%{transform:rotate(-2deg);}
    50%{transform:rotate(2deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .bunting span{animation:none;}
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    background: url('favicon.svg') no-repeat center top;
    background-size: clamp(400px, 85vw, 700px);
    opacity:0.04;
    pointer-events:none;
    z-index:0;
  }
  header.hero{
    padding:22px 20px 16px;
    text-align:center;
  }
  header.hero h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(2.6rem, 10vw, 3.6rem);
    letter-spacing:0.03em;
    margin:6px 0 2px;
    color:var(--red-deep);
    line-height:0.95;
  }
  header.hero .sub{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.12em;
    font-size:1.1rem;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  .view-tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .tab-btn{
    font-family:'Bebas Neue', sans-serif;
    font-size:1.3rem;
    letter-spacing:0.05em;
    padding:6px 20px;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink-soft);
    border-radius:20px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--teal-deep);
    color:#fff;
    border-color:var(--teal-deep);
  }

  nav.days{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 14px;
    -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;
  }
  nav.days a{
    flex:0 0 auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    font-weight:500;
    text-decoration:none;
    color:var(--ink);
    background:var(--paper-card);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:20px;
    white-space:nowrap;
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:18px 14px 0;
  }

  .day-section{
    margin-bottom:34px;
    scroll-margin-top:56px;
  }
  .day-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
    margin-bottom:14px;
  }
  .day-head .num{
    font-family:'Bebas Neue', sans-serif;
    font-size:2.4rem;
    line-height:1;
    color:var(--red-deep);
  }
  .day-head .meta{
    display:flex;
    flex-direction:column;
  }
  .day-head .weekday{
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:var(--ink-soft);
  }
  .day-head .month{
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  .nada{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    color:var(--ink-soft);
    background:var(--paper-card);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:16px;
    text-align:center;
  }

  .card{
    background:var(--paper-card);
    border-radius:14px;
    padding:16px 16px 14px;
    margin-bottom:14px;
    border:1px solid var(--line);
    box-shadow: 0 1px 0 rgba(43,27,23,0.05);
  }
  .card.comida{border-left:5px solid var(--saffron-deep);}
  .card.cena{border-left:5px solid var(--teal);}
  .card.actividad{border-left:5px solid var(--red);}
  .card.encuesta{border-left:5px solid var(--teal-deep);}

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .card-top h3{
    margin:0;
    font-size:1.05rem;
    font-weight:700;
  }
  .tag-type{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:3px 8px;
    border-radius:20px;
    color:#fff;
  }
  .comida .tag-type{background:var(--saffron-deep);}
  .cena .tag-type{background:var(--teal);}
  .actividad .tag-type{background:var(--red);}

  .block-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:10px 0 6px;
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .tag{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 6px 5px 12px;
    font-size:0.85rem;
  }
  .tag button{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:0.9rem;
    line-height:1;
    padding:2px 4px;
  }
  .empty-hint{
    font-size:0.8rem;
    color:var(--ink-soft);
    font-style:italic;
    margin-bottom:8px;
  }

  .add-row{
    display:flex;
    gap:6px;
  }
  .add-row input, .poll-form input{
    flex:1;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    font-family:'Work Sans', sans-serif;
    font-size:0.88rem;
    background:#fff;
  }
  .add-row button, .poll-form button, .btn-sec{
    padding:8px 14px;
    border-radius:8px;
    border:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#fff;
    cursor:pointer;
  }
  .comida .add-row button{background:var(--saffron-deep);}
  .cena .add-row button{background:var(--teal-deep);}
  .actividad .add-row button{background:var(--red-deep);}

  .poll-form{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .poll-form .opts-container{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .poll-option-block{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .poll-option-title{
    font-weight:600;
    font-size:0.92rem;
    margin-bottom:6px;
  }
  .btn-danger{
    background:var(--red);
    color:#fff;
    border:none;
    padding:4px 8px;
    border-radius:6px;
    font-size:0.7rem;
    cursor:pointer;
  }

  footer{
    text-align:center;
    font-size:0.75rem;
    color:var(--ink-soft);
    padding:24px 20px 0;
  }
  .status{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    height:16px;
  }
</style>
</head>
<body>

<div class="bunting" id="bunting"></div>

<header class="hero">
  <h1>Fiestas de Agosto</h1>
  <h1>La Ruina</h1>
  <div class="sub">14 — 18 · AGOSTO · 2026</div>
  <div class="view-tabs">
    <button class="tab-btn active" id="tab-program" onclick="switchTab('program')">Programa</button>
    <button class="tab-btn" id="tab-polls" onclick="switchTab('polls')">Encuestas</button>
  </div>
</header>

<nav class="days" id="daynav"></nav>

<main id="main"></main>

<div class="status" id="status"></div>

<footer>Toca "Añadir" para apuntarte · toca la ✕ de un nombre para quitarlo</footer>

<script>

let programState = null;
let pollsState = null;
let pollsLoaded = false;
let currentTab = 'program';
let useMock = false;

const MOCK_PROGRAM = {
  days: [
    { date:'14/08/2026', note:'Viernes — Arranque', activities:[
      { type:'comida', title:'Paella popular', participants:['Ana','Luis'], responsables:['Juan'] },
      { type:'actividad', title:'Concierto de apertura', participants:['Marta','Carlos','Elena'], responsables:['DJ Pepe'] }
    ]},
    { date:'15/08/2026', note:'Sábado — Fiestón', activities:[
      { type:'comida', title:'Asador al aire libre', participants:[], responsables:['María'] },
      { type:'cena', title:'Cena de gala', participants:['Pedro'], responsables:[] }
    ]},
    { date:'16/08/2026', note:'Domingo — Familiar', activities:[
      { type:'actividad', title:'Juegos infantiles', participants:['Sofía','Leo','Emma'], responsables:['Monitora Ana'] }
    ]},
    { date:'17/08/2026', note:'Lunes — Relax', activities:[] },
    { date:'18/08/2026', note:'Martes — Clausura', activities:[
      { type:'cena', title:'Cena de despedida', participants:[], responsables:[] },
      { type:'actividad', title:'Fuegos artificiales', participants:['Todos'], responsables:['Comisión'] }
    ]}
  ]
};

const MOCK_POLLS = [
  { id:'mock-1', question:'¿Qué cenamos el sábado 15?', options:[
    { text:'Paella', votes:['Ana','Luis'] },
    { text:'Asado', votes:['Pedro'] },
    { text:'Pizza', votes:['Marta','Carlos','Elena'] }
  ]},
  { id:'mock-2', question:'¿Bebida para la cena de clausura?', options:[
    { text:'Vino tinto', votes:['Juan'] },
    { text:'Cerveza', votes:['Pedro','Luis'] }
  ]}
];

function setStatus(msg, isError, sticky){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = isError ? '#A62639' : '';
  if(msg && !sticky) setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 2500);
}

async function loadProgram() {
  setStatus('Cargando programa...');
  try {
    const res = await fetch('/.netlify/functions/api?resource=program');
    if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
    const data = await res.json();
    programState = data.record;
    setStatus('');
    return;
  } catch (e) {
    console.error('Error al cargar programa:', e);
  }
  // fallback a mock
  programState = JSON.parse(JSON.stringify(MOCK_PROGRAM));
  useMock = true;
  setStatus('⚠ Usando datos de ejemplo — cambios no se guardan', true, true);
}

async function loadPolls() {
  if (pollsLoaded) return;
  setStatus('Cargando encuestas...');
  try {
    const res = await fetch('/.netlify/functions/api?resource=polls');
    if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
    const data = await res.json();
    if (data.record && Array.isArray(data.record.polls)) {
      pollsState = data.record.polls;
    } else if (Array.isArray(data.record)) {
      pollsState = data.record;
    } else {
      pollsState = [];
    }
    pollsLoaded = true;
    setStatus('');
    return;
  } catch (e) {
    console.error('Error al cargar encuestas:', e);
  }
  // fallback a mock
  pollsState = JSON.parse(JSON.stringify(MOCK_POLLS));
  pollsLoaded = true;
  useMock = true;
  setStatus('⚠ Usando datos de ejemplo — cambios no se guardan', true, true);
}

async function saveProgram() {
  if(useMock){
    setStatus('⚠ Modo demo — los cambios no se guardan', true, true);
    return;
  }
  setStatus('Guardando programa...');
  try {
    const res = await fetch('/.netlify/functions/api?resource=program', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(programState)
    });
    if (!res.ok) throw new Error('Error al guardar');
    setStatus('Guardado ✓');
  } catch (e) {
    setStatus('No se pudo guardar', true);
  }
}

async function savePolls() {
  if(useMock){
    setStatus('⚠ Modo demo — los cambios no se guardan', true, true);
    return;
  }
  setStatus('Guardando encuestas...');
  try {
    const res = await fetch('/.netlify/functions/api?resource=polls', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ polls: pollsState })
    });
    if (!res.ok) throw new Error('Error al guardar');
    setStatus('Guardado ✓');
  } catch (e) {
    setStatus('No se pudo guardar', true);
  }
}
function weekdayLabel(dateStr){
  const [d,m,y] = dateStr.split('/').map(Number);
  const dt = new Date(y, m-1, d);
  const wd = dt.toLocaleDateString('es-ES', {weekday:'long'});
  const month = dt.toLocaleDateString('es-ES', {month:'long'});
  return { weekday: wd.charAt(0).toUpperCase()+wd.slice(1), month, day: d };
}

const TYPE_LABEL = { comida:'Comida', cena:'Cena', actividad:'Actividad' };

function renderBunting(){
  const b = document.getElementById('bunting');
  let html = '';
  for(let i=0;i<22;i++) html += '<span></span>';
  b.innerHTML = html;
}

async function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-program').classList.toggle('active', tab === 'program');
  document.getElementById('tab-polls').classList.toggle('active', tab === 'polls');
  document.getElementById('daynav').style.display = tab === 'program' ? 'flex' : 'none';

  if (tab === 'polls') {
    if (!pollsLoaded) {
      document.getElementById('main').innerHTML = '<div class="nada">Cargando encuestas...</div>';
      await loadPolls();
    }
    renderMainPolls();
  } else {
    renderMainProgram();
  }
}

function renderNav(){
  const nav = document.getElementById('daynav');
  if(!programState || !programState.days) return;
  nav.innerHTML = programState.days.map(d=>{
    const {weekday, day} = weekdayLabel(d.date);
    return `<a href="#day-${day}">${weekday.slice(0,3)} ${day}</a>`;
  }).join('');
}

function tagHtml(name, removeAttr){
  return `<span class="tag">${escapeHtml(name)}<button ${removeAttr} aria-label="Quitar">✕</button></span>`;
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMainProgram(){
  const main = document.getElementById('main');
  if(!programState || !programState.days) return;

  const createForm = `
    <div class="card encuesta" style="margin-bottom:22px;">
      <div class="card-top">
        <h3>➕ Nueva actividad</h3>
      </div>
      <div class="poll-form">
        <select id="new-act-day" style="padding:8px;border-radius:8px;border:1px solid var(--line);font-family:'Work Sans',sans-serif;font-size:0.88rem;background:#fff;">
          ${programState.days.map((d,idx)=>{ const w = weekdayLabel(d.date); return `<option value="${idx}">${w.weekday} ${w.day} — ${d.note || d.date}</option>`; }).join('')}
        </select>
        <input type="text" id="new-act-title" placeholder="Título de la actividad" />
        <select id="new-act-type" style="padding:8px;border-radius:8px;border:1px solid var(--line);font-family:'Work Sans',sans-serif;font-size:0.88rem;background:#fff;">
          <option value="comida">🍽️ Comida</option>
          <option value="cena">🌙 Cena</option>
          <option value="actividad">🎉 Actividad</option>
        </select>
        <button type="button" class="btn-sec" style="background:var(--red-deep);" onclick="addActivity()">Crear actividad</button>
      </div>
    </div>
  `;

  main.innerHTML = createForm + programState.days.map((day, dIdx)=>{
    const {weekday, month, day: dnum} = weekdayLabel(day.date);
    let body;
    if(day.activities.length === 0){
      body = `<div class="nada">${day.note || 'Nada programado'}</div>`;
    }else{
      body = day.activities.map((act, aIdx)=>{
        const partTags = act.participants.length
          ? `<div class="tags">${act.participants.map((n,tIdx)=>tagHtml(n, `data-remove-act="${dIdx}|${aIdx}|participants|${tIdx}"`)).join('')}</div>`
          : `<div class="empty-hint">Nadie apuntado todavía</div>`;
        const respTags = act.responsables.length
          ? `<div class="tags">${act.responsables.map((n,tIdx)=>tagHtml(n, `data-remove-act="${dIdx}|${aIdx}|responsables|${tIdx}"`)).join('')}</div>`
          : `<div class="empty-hint">Sin responsable asignado</div>`;
        return `
        <div class="card ${act.type}">
          <div class="card-top">
            <h3>${escapeHtml(act.title)}</h3>
            <div>
              <span class="tag-type">${TYPE_LABEL[act.type] || escapeHtml(act.type)}</span>
              <button class="btn-danger" style="margin-left:8px;" onclick="deleteActivity(${dIdx},${aIdx})">Eliminar</button>
            </div>
          </div>
          <div class="block-label">Participan</div>
          ${partTags}
          <div class="add-row">
            <input type="text" placeholder="Tu nombre" id="in-${dIdx}-${aIdx}-participants" />
            <button data-add-act="${dIdx}|${aIdx}|participants">Añadir</button>
          </div>
          <div class="block-label">Responsables</div>
          ${respTags}
          <div class="add-row">
            <input type="text" placeholder="Nombre responsable" id="in-${dIdx}-${aIdx}-responsables" />
            <button data-add-act="${dIdx}|${aIdx}|responsables">Añadir</button>
          </div>
        </div>`;
      }).join('');
    }
    return `
    <section class="day-section" id="day-${dnum}">
      <div class="day-head">
        <div class="num">${dnum}</div>
        <div class="meta">
          <div class="weekday">${weekday}</div>
          <div class="month">${month} 2026</div>
        </div>
      </div>
      ${body}
    </section>`;
  }).join('');

  main.querySelectorAll('[data-add-act]').forEach(btn=> btn.addEventListener('click', onAddAct));
  main.querySelectorAll('.card input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const [dIdx,aIdx,field] = inp.id.replace('in-','').split('-');
        addPersonAct(Number(dIdx), Number(aIdx), field, inp);
      }
    });
  });
  main.querySelectorAll('[data-remove-act]').forEach(btn=> btn.addEventListener('click', onRemoveAct));
}

function renderMainPolls(){
  const main = document.getElementById('main');
  
  const createForm = `
    <div class="card encuesta">
      <div class="card-top">
        <h3>Crear nueva encuesta</h3>
      </div>
      <div class="poll-form">
        <input type="text" id="poll-question-input" placeholder="Pregunta (ej. ¿Qué cenamos el 15?)" />
        <div class="opts-container" id="poll-options-container">
          <input type="text" class="poll-opt-input" placeholder="Opción 1" />
          <input type="text" class="poll-opt-input" placeholder="Opción 2" />
        </div>
        <div style="display:flex; gap:6px;">
          <button type="button" class="btn-sec" style="background:var(--saffron-deep);" onclick="addOptionInput()">+ Opción</button>
          <button type="button" class="btn-sec" style="background:var(--teal-deep); flex:1;" onclick="createPoll()">Crear encuesta</button>
        </div>
      </div>
    </div>
  `;

  const pollsList = pollsState.map((poll, pIdx)=>{
    const optionsHtml = poll.options.map((opt, oIdx)=>{
      const votesTags = opt.votes.length
        ? `<div class="tags">${opt.votes.map((vName, vIdx)=>tagHtml(vName, `data-remove-vote="${pIdx}|${oIdx}|${vIdx}"`)).join('')}</div>`
        : `<div class="empty-hint">Nadie ha votado esto</div>`;

      return `
        <div class="poll-option-block">
          <div class="poll-option-title">${escapeHtml(opt.text)}</div>
          ${votesTags}
          <div class="add-row">
            <input type="text" placeholder="Tu nombre para votar" id="in-poll-${pIdx}-${oIdx}" />
            <button style="background:var(--teal-deep);" data-add-vote="${pIdx}|${oIdx}">Votar</button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="card encuesta">
        <div class="card-top">
          <h3>${escapeHtml(poll.question)}</h3>
          <button class="btn-danger" onclick="deletePoll(${pIdx})">Eliminar</button>
        </div>
        ${optionsHtml}
      </div>
    `;
  }).join('');

  main.innerHTML = createForm + (pollsList || '<div class="nada">No hay encuestas creadas</div>');

  main.querySelectorAll('[data-add-vote]').forEach(btn=> btn.addEventListener('click', onAddVote));
  main.querySelectorAll('.poll-option-block input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const [pIdx, oIdx] = inp.id.replace('in-poll-','').split('-');
        addVote(Number(pIdx), Number(oIdx), inp);
      }
    });
  });
  main.querySelectorAll('[data-remove-vote]').forEach(btn=> btn.addEventListener('click', onRemoveVote));
}

// Acciones Programa
async function addActivity(){
  const dayIdx = Number(document.getElementById('new-act-day').value);
  const title = document.getElementById('new-act-title').value.trim();
  const type = document.getElementById('new-act-type').value;
  if(!title){ alert('Escribe un título'); return; }
  programState.days[dayIdx].activities.push({ type, title, participants:[], responsables:[] });
  renderMainProgram();
  await saveProgram();
}

async function deleteActivity(dIdx, aIdx){
  if(!confirm('¿Eliminar esta actividad?')) return;
  programState.days[dIdx].activities.splice(aIdx, 1);
  renderMainProgram();
  await saveProgram();
}

async function onAddAct(e){
  const [dIdx, aIdx, field] = e.currentTarget.getAttribute('data-add-act').split('|');
  const input = document.getElementById(`in-${dIdx}-${aIdx}-${field}`);
  await addPersonAct(Number(dIdx), Number(aIdx), field, input);
}

async function addPersonAct(dIdx, aIdx, field, input){
  const name = input.value.trim();
  if(!name) return;
  programState.days[dIdx].activities[aIdx][field].push(name);
  input.value = '';
  renderMainProgram();
  await saveProgram();
}

async function onRemoveAct(e){
  const [dIdx, aIdx, field, tIdx] = e.currentTarget.getAttribute('data-remove-act').split('|');
  programState.days[Number(dIdx)].activities[Number(aIdx)][field].splice(Number(tIdx), 1);
  renderMainProgram();
  await saveProgram();
}

// Acciones Encuestas
function addOptionInput(){
  const container = document.getElementById('poll-options-container');
  const count = container.querySelectorAll('input').length + 1;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'poll-opt-input';
  inp.placeholder = `Opción ${count}`;
  container.appendChild(inp);
}

async function createPoll(){
  const qInput = document.getElementById('poll-question-input');
  const question = qInput.value.trim();
  if(!question){
    alert('Escribe una pregunta');
    return;
  }

  const optInputs = document.querySelectorAll('.poll-opt-input');
  const options = [];
  optInputs.forEach(inp=>{
    const val = inp.value.trim();
    if(val) options.push({ text: val, votes: [] });
  });

  if(options.length < 2){
    alert('Debes añadir al menos 2 opciones');
    return;
  }

  pollsState.unshift({ id: 'poll-' + Date.now(), question, options });
  renderMainPolls();
  await savePolls();
}

async function deletePoll(pIdx){
  if(confirm('¿Eliminar esta encuesta?')){
    pollsState.splice(pIdx, 1);
    renderMainPolls();
    await savePolls();
  }
}

async function onAddVote(e){
  const [pIdx, oIdx] = e.currentTarget.getAttribute('data-add-vote').split('|');
  const input = document.getElementById(`in-poll-${pIdx}-${oIdx}`);
  await addVote(Number(pIdx), Number(oIdx), input);
}

async function addVote(pIdx, oIdx, input){
  const name = input.value.trim();
  if(!name) return;
  pollsState[pIdx].options[oIdx].votes.push(name);
  input.value = '';
  renderMainPolls();
  await savePolls();
}

async function onRemoveVote(e){
  const [pIdx, oIdx, vIdx] = e.currentTarget.getAttribute('data-remove-vote').split('|');
  pollsState[Number(pIdx)].options[Number(oIdx)].votes.splice(Number(vIdx), 1);
  renderMainPolls();
  await savePolls();
}

async function init(){
  renderBunting();
  await loadProgram();
  renderNav();
  renderMainProgram();
}

init();
</script>
</body>
</html>
